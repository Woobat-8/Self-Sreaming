services:
  api:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ${LIBRARY_HOST_PATH:-./library}:/media/library
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file: .env
    depends_on:
      - caddy
    restart: unless-stopped
    profiles:
      - tunnel
